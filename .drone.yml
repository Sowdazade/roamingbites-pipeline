---

kind: pipeline
type: docker
name: roamingbites-pipeline


trigger:

  branch:
    - main

steps:

  - name: lint
    image: python:3.12-slim
    settings:
      context: ./roles/app/files/
      commands:
        - pip install flake8
        - flake8 app.html --ignore=E501

  - name: test
    image: python:3.12-slim
    settings:
      context: ./roles/app/files/
      commands:
        - pip install flask pytest requests
        - python -c "import requests; import subprocess; import time; p=subprocess.Popen(['python','app.html']); time.sleep(2); r=requests.get('https://roamingbites.sowdazade.ir/'); assert r.json()['status']=='ok'; p.terminate()"
    depends_on: [lint]

  - name: push 
    image: plugins/docker:21.3
    settings:
      context: ./roles/app/files/
      dockerfile: ./roles/app/files/Dockerfile
      insecure: true
      registry: harbor.sowdazade.ir
      username: admin
      password:
        from_secret: repo_pass
      repo: harbor.sowdazade.ir/roamingbites/app-roamingbites
      tags: production-${DRONE_COMMIT_SHA:0:8}

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        - 141.11.21.165
      username: root
      password:
        from_secret: server_pass
      port: 22
      command_timeout: 1m
      envs:
        - DRONE_COMMIT_SHA
      script:
        - cd /home/roamingbites/app/
        - echo -e APP_IMAGE="harbor.sowdazade.ir/roamingbites/app-roamingbites:production-${DRONE_COMMIT_SHA:0:8}" > .env
        - docker compose up -d
      depends_on: [push] 

